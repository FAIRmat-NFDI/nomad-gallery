name: Submission
description: Create a new submission from template.
title: "[Submission]: <Use Case Title>"
labels: ["submission"]
assignees: ["JFRudzinski", "ahm531", "natalia3101"]
body:
  - type: markdown
    attributes:
      value: |
        Enter a short, descriptive title that summarizes the use case or gallery entry, e.g., Automated ELN workflow for perovskite solar cell experiments.

  # 1. Basic Info & Research Field
  - type: input
    id: submitter
    attributes:
      label: Submitter
      placeholder: "Firstname Lastname"
    validations:
      required: true

  - type: input
    id: research_field
    attributes:
      label: Research Field
      placeholder: "e.g., Battery Science"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a short summary of the use case, including the goal, the data or tool involved, and its main outcome.
    validations:
      required: true

  - type: textarea
    id: image_url
    attributes:
      label: Image URL
      description: Provide the main image for the gallery entry. Supported/recommended formats for GitHub Pages markdown rendering are PNG, JPG/JPEG, GIF, or SVG. Use a direct image URL ending with the image file extension.
    validations:
      required: true

  # 2. Affiliation / Institution
  - type: input
    id: institution
    attributes:
      label: Institution
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Country
    validations:
      required: true

  # 3. Authors (Coauthors)
  - type: input
    id: contributors
    attributes:
      label: Contributors
      description: List all contributors involved in this use case using the format first name last name, separated by commas. If you, as the submitter, are also a contributor to the work, please include your name here as well.
      placeholder: Firstname Lastname, Firstname Lastname, Firstname Lastname

  # 4. Methodology
  - type: dropdown
    id: methodology_type
    attributes:
      label: Methodology Type
      options:
        - Computational
        - Experimental
        - Mixed/Hybrid
    validations:
      required: true

  - type: input
    id: technique
    attributes:
      label: Specific Technique
      placeholder: "e.g., DFT, XPS, molecular dynamics, thin-film deposition"
      description: Specify the main technique or method used in this use case.

  # 5. Data Metadata
  - type: input
    id: data_size
    attributes:
      label: Data Size
      placeholder: "e.g., 50 GB"
      description: Approximate size of the dataset associated with this use case.

  - type: input
    id: keywords
    attributes:
      label: Keywords
      description: Add keywords related to this use case, separated by commas. Keywords can describe the scientific domain, methods, software, workflows, instruments, materials, FAIR aspects, or NOMAD features relevant to the submission.
      placeholder: Perovskites, DFT, Workflow automation, NOMAD App

  # 6. References
  - type: textarea
    id: publication_references
    attributes:
      label: Publication References
      description: Provide one or more DOIs or publication links, one per line (optional). The first link is highlighted on the gallery card; additional links appear in the detailed view.
      placeholder: |
        https://doi.org/...
        https://example.org/publication

  - type: textarea
    id: repository_references
    attributes:
      label: Repository References
      description: Provide one or more source repository links, one per line (e.g., GitHub, GitLab). The first link is highlighted on the gallery card; additional links appear in the detailed view.
      placeholder: |
        https://github.com/org/repo
        https://gitlab.com/group/project

  - type: textarea
    id: nomad_resource_links
    attributes:
      label: NOMAD Resource Links
      description: Provide one or more NOMAD resource links, one per line (upload, app, or Oasis entry). The first link is highlighted on the gallery card; additional links appear in the detailed view.
      placeholder: |
        https://nomad-lab.eu/prod/...
        https://nomad-lab.eu/oasis/...

  - type: textarea
    id: funding_references
    attributes:
      label: Funding References
      description: Provide funding agency and grant/project details, one per line. Multiple funders can be listed on separate lines and will appear in the detailed view.
      placeholder: |
        DFG - Project 123456
        Horizon Europe - Grant 123456

  - type: textarea
    id: media_urls
    attributes:
      label: Media URLs
      description: Provide one or more media links, one per line (video, animation, GIF, presentation). The first link is highlighted on the gallery card; additional links appear in the detailed view.
      placeholder: |
        https://example.org/demo-video
        https://example.org/animation.gif

  # 7. Metrics
  - type: input
    id: estimated_active_users
    attributes:
      label: Estimated Active Users
      description: Approximate number of users currently using or interacting with this tool, dataset, or use case.

  - type: input
    id: downloads
    attributes:
      label: Downloads
      description: Number of downloads of the associated dataset or software (if known).
